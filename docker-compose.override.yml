# Extra services added on top of the Astro CLI's generated docker-compose.
# `astro dev start` merges this file automatically.

services:
  mongodb:
    image: mongo:7.0
    container_name: currency_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: currency_db
    ports:
      - "27017:27017"
    # ---- Persistent storage ----
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    # ---- Docker networking ----
    networks:
      - airflow
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      project: "currency-exchange-etl"
      role: "primary-database"

  mongo-express:
    image: mongo-express:1.0.2
    container_name: currency_mongo_express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_BASICAUTH: "true"
    ports:
      - "8081:8081"
    networks:
      - airflow
    labels:
      project: "currency-exchange-etl"
      role: "database-admin-ui"

# Named volumes -> data survives `astro dev stop` / container restarts
volumes:
  mongo_data:
    name: currency_mongo_data
  mongo_config:
    name: currency_mongo_config

# Astro's compose already defines the `airflow` bridge network that the
# scheduler/api-server use; joining it lets Airflow reach MongoDB at
# hostname `mongodb`.
networks:
  airflow:
    driver: bridge
